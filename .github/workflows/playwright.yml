name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Upstream apps under test, pinned so a change upstream can't break CI unannounced.
  BACKEND_REPO: c4ffein/realworld-django-ninja
  BACKEND_REF: 04ef47ced437ee8795a13bdcbc2eff2be19e33bd
  FRONTEND_REPO: realworld-apps/angular-realworld-example-app
  FRONTEND_REF: dd99ed2cf39c805d719f943c5d7061a5683d98a8
  # The CI database is created empty for each run and thrown away afterwards,
  # so these throwaway credentials are not secrets. The "Seed admin user" step registers the account.
  ADMIN_USER_EMAIL: ci-admin@example.com
  ADMIN_USER_PASSWORD: ci-admin-password
  ADMIN_USERNAME: ci_admin

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start pulling the Playwright image
        # The image tag must match the installed @playwright/test version exactly, so read it from
        # the lockfile. The pull runs in the background while the apps start.
        run: |
          PLAYWRIGHT_IMAGE="mcr.microsoft.com/playwright:v$(jq -r '.packages["node_modules/@playwright/test"].version' package-lock.json)-noble"
          echo "PLAYWRIGHT_IMAGE=$PLAYWRIGHT_IMAGE" >> "$GITHUB_ENV"
          echo "Pulling $PLAYWRIGHT_IMAGE"
          nohup docker pull "$PLAYWRIGHT_IMAGE" > "$RUNNER_TEMP/image-pull.log" 2>&1 &

      - name: Check out backend
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: ${{ env.BACKEND_REF }}
          path: .ci/backend

      - name: Check out frontend
        uses: actions/checkout@v7
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_REF }}
          path: .ci/frontend
          submodules: true # the theme CSS lives in the realworld submodule

      - name: Start backend (Django + Postgres)
        # Upstream compose has no healthcheck, and Postgres restarts once after initializing, so
        # Django can run its migrations too early and exit. Start the db first, then wait until it
        # accepts TCP connections (the temporary init server only listens on a Unix socket).
        working-directory: .ci/backend
        run: |
          docker compose up -d db
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -h 127.0.0.1 -U postgres -q && break
            sleep 2
          done
          docker compose exec -T db pg_isready -h 127.0.0.1 -U postgres
          docker compose up -d --build realword-app

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2

      - name: Patch frontend to use the local backend
        # Upstream hard-codes the public demo API; these overrides point it at /api,
        # which the dev server proxies to the backend on :8000.
        run: cp -r ci/frontend/. .ci/frontend/

      - name: Start frontend
        working-directory: .ci/frontend
        run: |
          bun install --frozen-lockfile
          nohup npx ng serve --proxy-config proxy.conf.mjs --port 4200 > ../frontend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8000/api/tags && exit 0
            sleep 2
          done
          echo "Backend did not start"; exit 1

      - name: Seed admin user
        run: |
          curl -sf -X POST http://localhost:8000/api/users \
            -H 'Content-Type: application/json' \
            -d "{\"user\":{\"username\":\"$ADMIN_USERNAME\",\"email\":\"$ADMIN_USER_EMAIL\",\"password\":\"$ADMIN_USER_PASSWORD\"}}" \
            -o /dev/null -w "Registered admin user: HTTP %{http_code}\n"

      - name: Wait for frontend
        run: |
          for i in $(seq 1 90); do
            curl -sf -o /dev/null http://localhost:4200 && curl -sf -o /dev/null http://localhost:4200/api/tags && exit 0
            sleep 2
          done
          echo "Frontend did not start"; exit 1

      - name: Run Playwright tests (in the Playwright Docker image)
        # The image ships the browsers and their system libraries, so there is no
        # `playwright install --with-deps`. Host networking makes localhost:4200 the runner's app;
        # --ipc=host gives Chromium enough shared memory.
        run: |
          docker run --rm --network host --ipc=host \
            -v "$PWD":/work -w /work \
            -e CI -e ADMIN_USER_EMAIL -e ADMIN_USER_PASSWORD -e ADMIN_USERNAME \
            "$PLAYWRIGHT_IMAGE" \
            /bin/bash -c "npm ci && npx playwright test"

      - name: Show app logs
        if: ${{ failure() }}
        run: |
          echo "::group::Backend logs"; (cd .ci/backend && docker compose logs); echo "::endgroup::"
          echo "::group::Frontend logs"; cat .ci/frontend.log; echo "::endgroup::"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
